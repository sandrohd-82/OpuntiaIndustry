# ieGeek → HLS (remoto via Cloudflare Tunnel) + WebRTC (solo LAN).
# RTSP on-demand: si apre alla prima lettura HLS/WHEP e si chiude a idle.

logLevel: info

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts:
  - 127.0.0.1

pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandCloseAfter: 10s

paths: {}
