# MediaMTX in LAN di stabilimento (stessa rete delle ieGeek).
# Avvio: dalla cartella docker/mediamtx → docker compose up -d
# Il browser degli operatori deve raggiungere WEBRTC sulla porta 8889.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: opuntia-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_LAN_IP:-127.0.0.1}
